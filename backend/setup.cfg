[flake8]
max-line-length = 99
exclude =
    migrations,
    __pycache__,
    .git,
    venv,
    staticfiles
per-file-ignores =
    __init__.py:F401

[isort]
profile = black
line_length = 99
known_django = django
known_drf = rest_framework
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,DRF,FIRSTPARTY,LOCALFOLDER
skip_glob = */migrations/*
